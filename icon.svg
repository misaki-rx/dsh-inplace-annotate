<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">In-place Annotate · highlighting an agent reply with agree, disagree, and question actions</title>

  <!-- User message -->
  <path fill="#526170" stroke="#83909B" stroke-width="2" stroke-linejoin="round"
        d="M46 5h37q7 0 7 7v15l-7-4H46a9 9 0 0 1 0-18Z"/>
  <path d="M49 14h28" stroke="#EDF1F3" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Agent reply -->
  <path fill="#F7F3E9" stroke="#7B807D" stroke-width="2" stroke-linejoin="round"
        d="M13 32h48q9 0 9 9v34q0 9-9 9H15L4 90V41q0-9 9-9Z"/>
  <path fill="#FFBD59" d="M19 54h22l-3 10H16z"/>
  <path d="M15 45h27M15 59h42M15 73h23" fill="none" stroke="#495058"
        stroke-width="3.5" stroke-linecap="round"/>

  <!-- The chisel edge meets the end of the highlighted passage. -->
  <g transform="translate(11 7) scale(1.1) rotate(40 32 40)"
     stroke="#AD692D" stroke-width="3.5" stroke-linejoin="round">
    <path fill="#FFBD59" d="M23 10q0-4 4-4h10q4 0 4 4v23l-5 8h-9l-4-8z"/>
    <path fill="#FFF0C9" d="M28 41h8v6l-8 6z"/>
    <path fill="none" d="M24 32h16"/>
  </g>

  <!-- Feedback actions overlap the lower edge of the reply. -->
  <rect x="34" y="69" width="60" height="23" rx="7"
        fill="#38444F" stroke="#83909B" stroke-width="2"/>
  <defs>
    <path id="thumb" d="M0 7h3v8H0zm4 0 4-5q.5-.7.5-2 3 0 2.5 3l-.6 3H14q2 0 1.6 2l-1.4 5.6Q14 15 12 15H7l-3-1z"/>
  </defs>
  <use href="#thumb" transform="translate(38 73)" fill="#ADE1C1"/>
  <use href="#thumb" transform="translate(73 88) rotate(180)" fill="#FFAF9C"/>
  <g fill="none" stroke="#FFE0A1" stroke-width="3" stroke-linecap="round">
    <path d="M79 77a4.1 4.1 0 0 1 8 .7c0 3.4-4.2 3.3-4.2 6"/>
  </g>
  <circle cx="82.8" cy="88" r="1.6" fill="#FFE0A1"/>
</svg>
